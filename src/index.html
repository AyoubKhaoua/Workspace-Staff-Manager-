<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="parent flex h-screen">
      <aside class="h-screen w-[20%]">
        <nav
          class="h-full flex flex-col justify-between bg-amber-50 border-1 shadow-sm"
        >
          <div>
            <h3 class="p-3 font-bold text-gray-400">
              Staff Members (Unassigned)
            </h3>
            <!-- list profils -->
            <div class="workerList">
              <div
                class="w-[90%] h-13 border rounded-2xl ml-2 bg-white-300 flex justify-around items-center mt-2"
              >
                <div class="w-[50%] flex">
                  <div class="pr-2 pt-1.5">
                    <img
                      src="./images/me.png"
                      alt=""
                      class="w-10 h-10 rounded-full"
                      name="urlImage"
                    />
                  </div>
                  <div class="">
                    <p class="font-mono">name</p>
                    <p class="pb-2 font-light text-gray-500">type</p>
                  </div>
                </div>
                <div>
                  <p class="text-amber-600 font-bold">Edit</p>
                </div>
              </div>
            </div>
          </div>
          <div
            class="w-[90%] bg-green-500 mx-1.5 my-1.5 text-center rounded-2xl"
          >
            <button class="text-2xl text-white" id="open-modal">Add</button>
          </div>
        </nav>
      </aside>
      <!-- these imageRéception → uniquement les Réceptionnistes
Salle des serveurs → uniquement les Techniciens IT
Salle de sécurité → uniquement les Agents de sécurité
Manager → peut être affecté partout
Nettoyage → peut être affecté partout sauf à la Salle d’archives
Autres rôles → accès libre sauf aux zones restreintes -->

<div class="h-full w-[80%] space-y-6" id="workSpace">

  <!-- Salle de conférence -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm ">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle de conférence</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('salle-de-conference')">+</button>
    </div>

    <div class="salle-de-conference grid grid-cols-4 gap-3 p-4" >
      <div class="worker h-12 bg-blue-200 text-blue-900 flex items-center justify-center rounded-lg shadow border border-blue-300">A</div>
      <div class="worker h-12 bg-blue-200 text-blue-900 flex items-center justify-center rounded-lg shadow border border-blue-300">A</div>
      <div class="worker h-12 bg-blue-200 text-blue-900 flex items-center justify-center rounded-lg shadow border border-blue-300">A</div>

    </div>
  </div>

  <!-- Salle du personnel -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm ">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle du personnel</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('Salle-du-personnel')">+</button>
    </div>

    <div class="grid grid-cols-4 gap-3 p-4 Salle-du-personnel" >
      <div class="worker h-12 bg-purple-200 text-purple-900 flex items-center justify-center rounded-lg shadow border border-purple-300">A</div>
      <div class="worker h-12 bg-purple-200 text-purple-900 flex items-center justify-center rounded-lg shadow border border-purple-300">A</div>
      <div class="worker h-12 bg-purple-200 text-purple-900 flex items-center justify-center rounded-lg shadow border border-purple-300">AA</div>
      <div class="worker h-12 bg-purple-200 text-purple-900 flex items-center justify-center rounded-lg shadow border border-purple-300">A</div>

    </div>
  </div>

  <!-- Salle d'archives -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm ">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle d'archives</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('salle-d-archives')">+</button>
    </div>

    <div class="grid grid-cols-5 gap-3 p-4 salle-d-archives" >
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>

    </div>
  </div>

  <!-- Salle Réception -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm Salle-de-reception">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle Réception</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('salle-reception')">+</button>
    </div>

    <div class="grid grid-cols-4 gap-3 p-4 salle-reception " >
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
      <div class="worker h-12 bg-green-200 text-green-900 rounded-lg shadow border border-green-300 flex items-center justify-center">A</div>
    </div>
  </div>

  <!-- Salle des serveurs -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm Salle-des-serveurs">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle des serveurs</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('salle-des-serveurs')">+</button>
    </div>

    <div class="grid grid-cols-4 gap-3 p-4 salle-des-serveurs " >
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>

    </div>
  </div>

  <!-- Salle de sécurité -->
  <div class="bg-white border border-gray-300 rounded-xl shadow-sm ">
    <div class="flex justify-between items-center bg-gray-100 px-4 py-2 border-b border-gray-300 rounded-t-xl">
      <h1 class="font-semibold text-gray-800">Salle de sécurité</h1>
      <button class="w-8 h-8 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 shadow" onclick="openSalleModal('salle-de-securite')">+</button>
    </div>

    <div class="grid grid-cols-5 gap-3 p-4 salle-de-securite">
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
      <div class="worker h-12 bg-gray-200 rounded-lg border border-gray-300"></div>
  
    </div>
  </div>

</div>


    <!-- Modal d'ajouter -->
    <div
      id="modal"
      class="fixed inset-0 bg-[#000000d7] items-center justify-center"
    >
      <div
        class="bg-white w-[400px] p-6 rounded-xl shadow-lg relative max-h-[90vh] overflow-y-auto"
      >
        <!-- btn for close -->
        <button
          id="close-modal"
          class="absolute top-3 right-3 text-gray-500 hover:text-black text-lg font-bold"
        >
          ×
        </button>

        <h2 class="text-xl font-bold mb-4 border-b-2">Add Staff Member</h2>

        <form class="space-y-4" id="form" onsubmit="getValuesInputs(event)">
           <input type="hidden" id="idEmploye" class="inputHidden">
          <div>
            <label class="block text-gray-700 mb-1">Name</label>
            <input
              id="workerName"
              name="name"
              type="text"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Role</label>
            <select
              name="roleInCompany"
              id="role"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            >
              <option value=""></option>
              <option value="nettoyage">nettoyage</option>
              <option value="manager">manager</option>
              <option value="agent de sécurité">agent de sécurité</option>
              <option value="technicien it">technicien it</option>
              <option value="réceptionniste">réceptionniste</option>
              
            </select>
          </div>
          <div>
            <label class="block text-gray-700 mb-1">image</label>

            <input
              name="imgUrl"
              id="imgUrl"
              type="text"
              onchange="loadImage()"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />

            <img
              id="myimage"
              class="w-15 h-15 border-2 bg-gray-600 rounded-full flex mx-auto mt-4"
              src=""
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Email</label>
            <input
              name="email"
              id="email"
              type="email"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>
          <div>
            <label class="block text-gray-700 mb-1">Tele</label>
            <input
              name="tele"
              id="tele"
              type="number"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>
          <div>
            <button
              type="button"
              id="addExp"
              class="border-2 bg-amber-500 w-[150px] rounded-2xl text-center text-white font-sans"
              onclick="ajouterExperienc()"
            >
              Add Expirence
            </button>
          </div>
          <div id="Experiences" class="bg-gray-400 rounded-2xl"></div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white mt-2 py-2 rounded-lg hover:bg-blue-700"
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <!-- Modal d'affiche un profile -->
    <div
      id="workerInfoModal"
      class="hidden fixed inset-0 bg-black/70 items-center justify-center z-60"
    >
      <div
        class="bg-white w-[420px] p-6 rounded-2xl shadow-xl relative max-h-[90vh] overflow-y-auto"
      >
        <!-- Close Button -->
        <button
          id="closeWorkerInfo"
          class="absolute top-3 right-3 text-gray-600 hover:text-black text-2xl font-bold"
        >
          ×
        </button>
        <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-800">
          Informations de l’employé
        </h2>

        <!-- Photo -->
        <div class="flex justify-center mb-4">
          <img
            class="w-28 h-28 rounded-full object-cover border-2 border-gray-300 shadow"
            id="imgModal"
          />
        </div>

        <!-- Infos -->
        <div class="space-y-3 text-gray-700">
          <div>
            <p class="font-semibold">Nom :</p>
            <p class="bg-gray-100 p-2 rounded-md" id="workerName"></p>
          </div>

          <div>
            <p class="font-semibold">Rôle :</p>
            <p class="bg-gray-100 p-2 rounded-md" id="workerRole"></p>
          </div>

          <div>
            <p class="font-semibold">Email :</p>
            <p class="bg-gray-100 p-2 rounded-md" id="workerEmail"></p>
          </div>

          <div>
            <p class="font-semibold">Téléphone :</p>
            <p class="bg-gray-100 p-2 rounded-md" id="workerTele"></p>
          </div>

          <!-- Experiences -->
          <div>
            <p class="font-semibold">Expériences :</p>
            <div class="space-y-3 bg-gray-100 p-3 rounded-md">
              <div
                class="bg-white p-3 rounded-lg shadow border"
                id="experiences"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>
 
  <!-- Modal: Select worker to add into salle -->
<div
  id="salleWorkersModal"
  class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50"
>
  <div class="bg-white w-[450px] max-h-[90vh] overflow-y-auto p-6 rounded-2xl shadow-xl relative">
    
    <!-- Close -->
    <button
      id="closeSalleWorkers"
      class="absolute top-3 right-3 text-gray-600 hover:text-black text-2xl font-bold"
    >×</button>

    <h2 id="salleTitle" class="text-xl font-bold text-center mb-4"></h2>

    <!-- All workers list -->
    <div id="salleWorkersList" class="space-y-3"></div>
  </div>
</div>



    <script src="script.js"></script>
  </body>
</html>
