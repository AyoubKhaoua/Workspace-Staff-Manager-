<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="parent flex h-screen">
      <aside class="h-screen w-[20%]">
        <nav
          class="h-full flex flex-col justify-between bg-amber-50 border-1 shadow-sm"
        >
          <div>
            <h3 class="p-3 font-bold text-gray-400">
              Staff Members (Unassigned)
            </h3>
            <!-- list profils -->
            <div class="workerList">
              <div
                class="w-[90%] h-13 border rounded-2xl ml-2 bg-white-300 flex justify-around items-center mt-2"
              >
                <div class="w-[50%] flex">
                  <div class="pr-2 pt-1.5">
                    <img
                      src="./images/me.png"
                      alt=""
                      class="w-10 h-10 rounded-full"
                      name="urlImage"
                    />
                  </div>
                  <div class="">
                    <p class="font-mono">name</p>
                    <p class="pb-2 font-light text-gray-500">type</p>
                  </div>
                </div>
                <div>
                  <p class="text-amber-600 font-bold">Edit</p>
                </div>
              </div>
            </div>
          </div>
          <div
            class="w-[90%] bg-green-500 mx-1.5 my-1.5 text-center rounded-2xl"
          >
            <button class="text-2xl text-white" id="open-modal">Add</button>
          </div>
        </nav>
      </aside>
      <!-- these imageRéception → uniquement les Réceptionnistes
Salle des serveurs → uniquement les Techniciens IT
Salle de sécurité → uniquement les Agents de sécurité
Manager → peut être affecté partout
Nettoyage → peut être affecté partout sauf à la Salle d’archives
Autres rôles → accès libre sauf aux zones restreintes -->

      <div class="h-full w-[80%]" id="workSpace">
        <div class="Salle-conférence bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            Salle de conférence
          </h1>
          <div class="rome1 bg-amber-500">
            <div class="worker bg-amber-300">a</div>
            <div class="worker bg-amber-300">a</div>
            <div class="worker bg-amber-300">a</div>
            <div class="worker bg-amber-300">a</div>
            <div class="worker bg-amber-300">aa</div>
            <div class="worker bg-amber-300">a</div>
          </div>
        </div>
        <div class="Ralle-personnel bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            Salle du personnel
          </h1>
          <div class="rome2 bg-amber-500">
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">aa</div>
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">a</div>
            <div class="worker bg-amber-700">a</div>
          </div>
          <button class="w-full bg-amber-50 font-bold text-center">+</button>
        </div>
        <div class="salle-d'archives bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            salle d'archives
          </h1>
          <div class="rome3 bg-amber-500">
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
          </div>
        </div>
        <div class="salle-Réception bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            salle Réception
          </h1>
          <div class="rome4 bg-amber-500">
            <div class="worker bg-amber-800">a</div>
            <div class="worker bg-amber-800">a</div>
            <div class="worker bg-amber-800">a</div>
            <div class="worker bg-amber-800">a</div>
            <div class="worker bg-amber-800">a</div>
            <div class="worker bg-amber-800">a</div>
          </div>
        </div>
        <div class="Salle-serveurs bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            Salle des serveurs
          </h1>
          <div class="rome5">
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
          </div>
        </div>
        <div class="Salle-sécurité bg-amber-500">
          <h1 class="w-full bg-amber-50 font-bold text-center">
            Salle de sécurité
          </h1>
          <div class="rome6">
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
            <div class="worker"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal d'ajouter -->
    <div
      id="modal"
      class="fixed inset-0 bg-[#000000d7] items-center justify-center"
    >
      <div
        class="bg-white w-[400px] p-6 rounded-xl shadow-lg relative max-h-[90vh] overflow-y-auto"
      >
        <!-- btn for close -->
        <button
          id="close-modal"
          class="absolute top-3 right-3 text-gray-500 hover:text-black text-lg font-bold"
        >
          ×
        </button>

        <h2 class="text-xl font-bold mb-4 border-b-2">Add Staff Member</h2>

        <form class="space-y-4" id="form" onsubmit="getValuesInputs(event)">
          <div>
            <label class="block text-gray-700 mb-1">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Role</label>
            <select
              name="roleInCompany"
              id="role"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            >
              <option value=""></option>
              <option value="Cleaning">Cleaning</option>
              <option value="dev">dev</option>
              <option value="devops">devops</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 mb-1">image</label>

            <input
              name="imgUrl"
              id="imgUrl"
              type="text"
              onchange="loadImage()"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />

            <img
              id="myimage"
              class="w-15 h-15 border-2 bg-gray-600 rounded-full flex mx-auto mt-4"
              src=""
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Email</label>
            <input
              name="email"
              id="email"
              type="email"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>
          <div>
            <label class="block text-gray-700 mb-1">Tele</label>
            <input
              name="tele"
              id="tele"
              type="number"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>
          <div>
            <button
              type="button"
              id="addExp"
              class="border-2 bg-amber-500 w-[150px] rounded-2xl text-center text-white font-sans"
              onclick="ajouterExperienc()"
            >
              Add Expirence
            </button>
            <div id="Experiences" class="bg-gray-400 rounded-2xl">
              <div class="experienc p-4" id="0">
                <div>
                  <label for="">Company</label>
                  <input
                    type="text"
                    id="nameCompany"
                    class="nameCompany w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
                  />
                </div>
                <div>
                  <label for="">Role</label>
                  <input
                    type="text"
                    class="role w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
                  />
                </div>
                <div>
                  <label for="">from</label>
                  <input
                    type="date"
                    id="start"
                    class="start w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
                  />
                </div>
                <div>
                  <label for="">to</label>
                  <input
                    type="date"
                    id="end"
                    class="end w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
                  />
                </div>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white mt-2 py-2 rounded-lg hover:bg-blue-700"
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <!-- Modal d'affiche un profile -->
    <script src="script.js"></script>
  </body>
</html>
