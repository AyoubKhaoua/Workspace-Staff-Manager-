                    <img
                      src="./images/me.png"

                      class="w-10 h-10 rounded-full"
                    />
                  </div>
                  <div class="">

                    <p class="pb-2 font-light text-gray-500">type</p>

            <!-- author profils -->

          <div
            class="w-[90%] bg-green-500 mx-1.5 my-1.5 text-center rounded-2xl"
          >
            <button class="text-2xl text-white" id="open-modal">Add</button>
          </div>
        </nav>
      </aside>
      <!-- these image -->

          <div class="worker"></div>
          <div class="worker"></div>
          <div class="worker"></div>
          <div class="worker"></div>
          <div class="worker"></div>

          <div class="worker"></div>
        </div>
        <div class="rome4 bg-amber-500">
          <div class="worker"></div>

          <div class="worker"></div>

        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      id="modal"
      class="fixed inset-0 bg-[#000000d7] items-center justify-center"
    >
      <div class="bg-white w-[400px] p-6 rounded-xl shadow-lg relative">
        <!-- btn for close -->
        <button
          id="close-modal"
          class="absolute top-3 right-3 text-gray-500 hover:text-black text-lg font-bold"
        >
          ×
        </button>

        <h2 class="text-xl font-bold mb-4 border-b-2">Add Staff Member</h2>

        <form class="space-y-4">
          <div>
            <label class="block text-gray-700 mb-1">Name</label>
            <input
              type="text"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Role</label>
            <select
              name=""
              id="role"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            >
              <option value=""></option>
              <option value="Cleaning">Cleaning</option>
              <option value="dev">dev</option>
              <option value="devops">devops</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 mb-1">file</label>

            <input
              type="file"
              onchange="onFileSelected(event)"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />

            <img
              id="myimage"
              class="w-15 h-15 rounded-full flex mx-auto mt-4"
            />
          </div>

          <div>
            <label class="block text-gray-700 mb-1">Email</label>
            <input
              type="email"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
